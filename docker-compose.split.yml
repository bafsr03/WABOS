# WABOS — split deploy. Same image as the combined file, but the engine is now
# two independent processes that share one Postgres and talk over the internal
# keyed channel (STORE_INTERNAL_KEY / WA_INTERNAL_KEY) plus the Postgres event
# bridge. Restarting `whatsapp` no longer touches the store API, and vice-versa.
#
# Launch with:  docker compose -f docker-compose.split.yml up -d --build
# (Use this INSTEAD of docker-compose.yml — don't run both.)

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wabos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wabos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wabos -d wabos"]
      interval: 5s
      timeout: 5s
      retries: 10

  store:
    build:
      context: .
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}"
        NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-}"
    image: wabos
    restart: unless-stopped
    env_file: .env
    environment:
      ROLE: store
      PORT: "4000"
      NODE_ENV: production
      DATABASE_URL: postgres://wabos:${POSTGRES_PASSWORD}@postgres:5432/wabos
      WA_INTERNAL_URL: http://whatsapp:4000
    volumes:
      - store_data:/app/apps/engine/data   # optional daily backups
    depends_on:
      postgres:
        condition: service_healthy

  whatsapp:
    image: wabos
    restart: unless-stopped
    env_file: .env
    environment:
      ROLE: whatsapp
      PORT: "4000"
      NODE_ENV: production
      DATABASE_URL: postgres://wabos:${POSTGRES_PASSWORD}@postgres:5432/wabos
      STORE_INTERNAL_URL: http://store:4000
    volumes:
      - wa_auth:/app/apps/engine/auth   # WhatsApp session credentials (per business)
      - wa_data:/app/apps/engine/data   # WhatsApp media
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    image: wabos
    restart: unless-stopped
    command: ["pnpm", "--filter", "@wabos/dashboard", "start"]
    environment:
      NODE_ENV: production
      ENGINE_ORIGIN: http://store:4000       # all /api + /ws → store backend
      WA_ORIGIN: http://whatsapp:4000        # /api/media → whatsapp backend
    depends_on:
      - store
      - whatsapp

  web:
    image: wabos
    restart: unless-stopped
    command: ["pnpm", "--filter", "@wabos/web", "start"]
    environment:
      NODE_ENV: production

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      MARKETING_DOMAIN: ${MARKETING_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard
      - web

volumes:
  pgdata:
  wa_auth:
  wa_data:
  store_data:
  caddy_data:
  caddy_config:
