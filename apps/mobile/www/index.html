<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WABOS</title>
  <style>
    html,body{margin:0;height:100%;background:#5b4bff;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:24px;gap:12px}
    .logo{width:64px;height:64px;display:grid;place-items:center;border-radius:18px;
      background:rgba(255,255,255,.16);font-size:30px;font-weight:800}
    h1{margin:6px 0 0;font-size:22px}
    p{margin:0;max-width:320px;opacity:.85;font-size:14px;line-height:1.5}
    code{background:rgba(0,0,0,.2);padding:2px 6px;border-radius:6px;font-size:12.5px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">W</div>
    <h1>WABOS</h1>
    <p>Configura la URL del dashboard con <code>WABOS_APP_URL</code> y vuelve a ejecutar
       <code>cap sync</code>. Consulta la guía <em>App nativa (build)</em>.</p>
  </div>
</body>
</html>
